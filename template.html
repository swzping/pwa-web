        <style>
            .newPage:has(.newMyAccountFlag) {
                background-color: #f5f5f5;
                margin-bottom: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                /* padding-bottom: 48px; */
            }
            .newPage:has(.fullPage) {
                margin: 0 !important;
                padding: 0 !important;
            }
            .yellow-link {
                color: var(--color-primary) !important;
            }
            .bg-red-link {
                background: red;
                color: #fff;
                border-radius: 5px;
                padding: 0px 5px;
            }

            .no-gutters {
                margin-right: 0px !important;
                margin-left: 0px !important;
            }

            @media (min-width: 1920) {
                .hidden-xl {
                    display: none !important;
                }
            }

            @media (max-width: 767px) {
                .hidden-mobile {
                    display: none !important;
                }
                .newPage:has(.newMyAccountFlag) {
                    display: block;
                }
            }

            @media (min-width: 768px) {
                .hidden-desktop {
                    display: none !important;
                }
                .hidden-sm {
                    display: none !important;
                }
            }

            @media (min-width: 1024px) and (max-width: 1199px) {
                .hidden-md {
                    display: none !important;
                }
            }

            @media (min-width: 1200px) and (max-width: 1919px) {
                .hidden-lg {
                    display: none !important;
                }
            }
        </style>

    <body>
        <div id="root"></div>

        <!-- Fallback for when JavaScript is disabled. -->
        <noscript>
            <style>
                .fallback-nojs {
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                    text-align: center;
                }
                .fallback-nojs a {
                    color: currentColor;
                }
                .fallback-closed {
                    height: 40vh;
                }
                .fallback-heading {
                    font-family: 'Source Serif Pro';
                    font-weight: 600;
                    padding-bottom: 16px;
                    font-size: xx-large;
                }
                .fallback-message {
                    font-family: 'Muli';
                }
                @media only screen and (max-width: 768px) {
                    .fallback-heading {
                        font-size: x-large;
                    }
                }
            </style>
            <div class="fallback-nojs">
                <img
                    class="fallback-closed"
                    alt="JavaScript is disabled"
                    src="/venia-static-assets/icons/icon-192x192.png"
                />
                <div class="fallback-heading">Oops! JavaScript is disabled</div>
                <div class="fallback-message">
                    To browse the Venia store,<br />
                    <a href="https://www.enable-javascript.com"
                        >enable JavaScript in your browser.</a
                    >
                </div>
            </div>
        </noscript>
        <!-- Inlined Data -->
        {{#pageTypeNonce}}
        <script nonce="{{pageTypeNonce}}">
            try {
                var INLINED_PAGE_TYPE = JSON.parse(
                    '{{pageType}}'.replace(/&quot;/g, '"')
                );
            } catch (error) {}
        </script>

        {{#webpackChunks}}
        <script type="text/javascript" src="/{{.}}"></script>
        {{/webpackChunks}} {{/pageTypeNonce}}
        <!-- /Inlined Data -->
    </body>
